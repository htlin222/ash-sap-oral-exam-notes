name: Release chapter videos

# 每章一支 16:9 影片：靜態投影片 + zh-TW-YunJheNeural 語音旁白，逐題做成
# clip 再串接成一支章節影片，全部完成後發佈到同一個 GitHub Release。
#
# 兩階段：`detect` 決定要重建哪些章節（並先建立好共用的 release，避免
# build 端的 49 個平行 job 搶著建立同一個 release 造成 race）；`build`
# 用 matrix 讓每個章節各自跑一個 runner，平行處理。

on:
  # 注意：push 只在 converted/**.md 變動時自動跑，且只重建有改的章節 ——
  # 影片渲染比 EPUB/PDF/網站貴很多（逐題 TTS + ffmpeg），刻意不讓
  # video-build/** 的一般腳本調整自動觸發全部 49 章重建。改完管線後要
  # 全量重建，用下面的 workflow_dispatch（chapter_ids 留空 = 全部）手動觸發。
  push:
    branches: [main]
    paths:
      - "converted/**.md"
  workflow_dispatch:
    inputs:
      chapter_ids:
        description: "空白分隔的章節檔名（不含 .md，留空 = 全部 49 章）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.chapters.outputs.ids }}
      tag: ${{ steps.chapters.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine chapters to build
        id: chapters
        run: |
          all_ids() {
            ls converted/*.md | xargs -n1 basename | sed 's/\.md$//' | tr '\n' ' '
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.chapter_ids }}" ]; then
              ids="${{ inputs.chapter_ids }}"
            else
              ids=$(all_ids)
            fi
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
              range="HEAD^..HEAD"
            else
              range="$before..HEAD"
            fi
            ids=$(git diff --name-only --diff-filter=AM "$range" -- 'converted/*.md' \
              | xargs -r -n1 basename | sed 's/\.md$//' | tr '\n' ' ')
          fi

          ids_json=$(printf '%s\n' $ids | grep . | jq -R . | jq -cs .) || ids_json="[]"
          echo "ids=$ids_json" >> "$GITHUB_OUTPUT"
          echo "Chapters to build: $ids_json"

          # One stable release for the whole project ("a release as final") —
          # every run (full or partial rebuild) uploads into this same tag
          # with --clobber, rather than each run creating its own dated tag.
          echo "tag=videos-final" >> "$GITHUB_OUTPUT"

      - name: Create shared release
        if: steps.chapters.outputs.ids != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.chapters.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it (chapters below will --clobber their own asset only)."
          else
            gh release create "$tag" \
              --title "ASH-SAP 章節影片（全 49 章）" \
              --notes "全書 49 章的口試問答影片，16:9，靜態黑白極簡投影片 + zh-TW-YunJheNeural 語音旁白逐題朗讀，每章一支。由 converted/*.md 自動建置，內容改寫自 ASH-SAP 9th Edition，僅供個人讀書與考試準備使用。"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Edge TTS starts rejecting requests ("No audio was received") once too
      # many concurrent chapters (each making dozens of calls) hit it at once
      # from the same GitHub Actions IP range — observed >50% failure rate
      # at max-parallel 15. Lower concurrency is the real fix; synth()'s own
      # retry/backoff (below) is a second line of defense, not the primary one.
      max-parallel: 6
      matrix:
        chapter: ${{ fromJson(needs.detect.outputs.ids) }}
    name: build (${{ matrix.chapter }})
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc imagemagick ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Render chapter video
        run: |
          cd video-build
          mkdir -p ../out
          uv run make_chapter_video.py \
            "../converted/${{ matrix.chapter }}.md" \
            -o "../out/${{ matrix.chapter }}.mp4"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.detect.outputs.tag }}" --clobber \
            "out/${{ matrix.chapter }}.mp4"
