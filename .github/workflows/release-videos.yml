name: Release chapter videos

# 每章一支 16:9 影片：靜態投影片 + zh-TW-YunJheNeural 語音旁白，逐題做成
# clip 再串接成一支章節影片，全部完成後發佈到同一個 GitHub Release。
#
# 兩階段：`detect` 決定要重建哪些章節（並先建立好共用的 release，避免
# build 端的 49 個平行 job 搶著建立同一個 release 造成 race）；`build`
# 用 matrix 讓每個章節各自跑一個 runner，平行處理。

on:
  push:
    branches: [main]
    paths:
      - "converted/**.md"
      - "video-build/**"
  workflow_dispatch:
    inputs:
      chapter_ids:
        description: "空白分隔的章節檔名（不含 .md，留空 = 全部 49 章）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.chapters.outputs.ids }}
      tag: ${{ steps.chapters.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine chapters to build
        id: chapters
        run: |
          all_ids() {
            ls converted/*.md | xargs -n1 basename | sed 's/\.md$//' | tr '\n' ' '
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.chapter_ids }}" ]; then
              ids="${{ inputs.chapter_ids }}"
            else
              ids=$(all_ids)
            fi
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
              range="HEAD^..HEAD"
            else
              range="$before..HEAD"
            fi
            # video-build/** 改了（管線本身），視為全量重建；否則只重建有改的章節。
            if git diff --name-only "$range" -- 'video-build/**' | grep -q .; then
              ids=$(all_ids)
            else
              ids=$(git diff --name-only --diff-filter=AM "$range" -- 'converted/*.md' \
                | xargs -r -n1 basename | sed 's/\.md$//' | tr '\n' ' ')
            fi
          fi

          ids_json=$(printf '%s\n' $ids | grep . | jq -R . | jq -cs .) || ids_json="[]"
          echo "ids=$ids_json" >> "$GITHUB_OUTPUT"
          echo "Chapters to build: $ids_json"

          tag="videos-v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create shared release
        if: steps.chapters.outputs.ids != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.chapters.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists (same-day rerun) — reusing it."
          else
            gh release create "$tag" \
              --title "ASH-SAP 章節影片 $tag" \
              --notes "由 converted/*.md 自動建置的章節口試問答影片（16:9，zh-TW-YunJheNeural 語音旁白）。各章節影片會陸續以 matrix job 上傳到這個 release。"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        chapter: ${{ fromJson(needs.detect.outputs.ids) }}
    name: build (${{ matrix.chapter }})
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc imagemagick ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Render chapter video
        run: |
          cd video-build
          mkdir -p ../out
          uv run make_chapter_video.py \
            "../converted/${{ matrix.chapter }}.md" \
            -o "../out/${{ matrix.chapter }}.mp4"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.detect.outputs.tag }}" --clobber \
            "out/${{ matrix.chapter }}.mp4"
